name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore backend/GitTraining.Api/GitTraining.Api.csproj

      - name: Build .NET API
        run: dotnet build backend/GitTraining.Api/GitTraining.Api.csproj --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Angular dependencies
        run: npm ci
        working-directory: frontend/git-training-ui

      - name: Build Angular
        run: npm run build
        working-directory: frontend/git-training-ui